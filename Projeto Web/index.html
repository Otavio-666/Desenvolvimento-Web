<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para minha mãe querida!❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars-container" id="stars"></div>

    <div class="container">
        <div class="envelope-wrapper" id="envelope">
            <div class="envelope">
                <div class="envelope-inside"></div>
                
                <div class="letter" id="letter">
                    <div class="letter-content">
                        <h2>Mãe...</h2>
                        <p id="typing-text"></p>
                        <div class="signature">Com todo o meu amor ❤️<br>Ass: Seu filho</div>
                    </div>
                </div>
            </div>
           
            <div class="heart-seal">
                <span class="pulse-ring"></span>
            </div>
            <div class="instruction">Toque no coração ✨</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
